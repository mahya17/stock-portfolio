<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Finance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body>
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="{{ url_for('index') }}">Finance</a>
        <div>
          {% if session.user_id %}
            <a class="nav-link d-inline text-light" href="{{ url_for('quote') }}">Quote</a>
            <a class="nav-link d-inline text-light" href="{{ url_for('buy') }}">Buy</a>
            <a class="nav-link d-inline text-light" href="{{ url_for('sell') }}">Sell</a>
            <a class="nav-link d-inline text-light" href="{{ url_for('history') }}">History</a>
            <a class="nav-link d-inline text-light" href="{{ url_for('logout') }}">Logout</a>
          {% else %}
            <a class="nav-link d-inline text-light" href="{{ url_for('login') }}">Login</a>
            <a class="nav-link d-inline text-light" href="{{ url_for('register') }}">Register</a>
          {% endif %}
        </div>
      </div>
    </nav>

    <main class="container mt-4">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>

{% extends "layout.html" %}
{% block content %}
  <h2>ورود</h2>
  <form action="{{ url_for('login') }}" method="post">
    <div class="mb-3">
      <input name="username" class="form-control" placeholder="نام کاربری" autofocus>
    </div>
    <div class="mb-3">
      <input name="password" type="password" class="form-control" placeholder="رمز عبور">
    </div>
    <button class="btn btn-primary" type="submit">ورود</button>
  </form>
  <p class="mt-2">حسابی ندارید؟ <a href="{{ url_for('register') }}">ثبت نام</a></p>
{% endblock %}

{% extends "layout.html" %}
{% block content %}
  <h2>خرید سهام</h2>
  <form action="{{ url_for('buy') }}" method="post">
    <div class="mb-3">
      <input type="text" name="symbol" class="form-control" placeholder="Symbol" autofocus required>
    </div>
    <div class="mb-3">
      <input type="number" name="shares" class="form-control" placeholder="Shares" min="1" required>
    </div>
    <button class="btn btn-primary" type="submit">Buy</button>
  </form>
{% endblock %}
